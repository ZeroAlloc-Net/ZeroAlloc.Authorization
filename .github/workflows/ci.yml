name: CI

on:
  push:
    branches: [main, 'release-please--**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Calculate version
        id: gitversion
        run: |
          version=$(dotnet dotnet-gitversion /output json /showvariable SemVer)
          echo "semver=$version" >> $GITHUB_OUTPUT
          echo "Calculated version: $version"

      - name: Restore
        run: dotnet restore ZeroAlloc.Authorization.slnx

      - name: Build
        # The version goes to the build, not only to pack: pack runs --no-build, so the
        # assemblies it packs carry whatever version this step stamped. Without it the
        # CI packages claimed the fallback 1.0.0. See ZeroAlloc-Net/.github#36.
        run: dotnet build ZeroAlloc.Authorization.slnx --configuration Release --no-restore -p:Version=${{ steps.gitversion.outputs.semver }}

      - name: Test
        run: dotnet test ZeroAlloc.Authorization.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/*.trx"

      - name: Pack (verify)
        run: dotnet pack ZeroAlloc.Authorization.slnx --configuration Release --no-build --output ./artifacts -p:Version=${{ steps.gitversion.outputs.semver }}

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg

  aot-smoke:
    runs-on: ubuntu-latest
    # Publishes samples/ZeroAlloc.Authorization.AotSmoke with PublishAot=true.
    # Exercises the authorization pipeline end-to-end — the generator emits the
    # policy composition as a proxy so any reflection regression shows as an
    # IL2026/IL3050 error during ILC.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Install AOT native toolchain
        # NativeAOT links with clang and the zlib headers. The runner image ships clang, so apt
        # runs only for what is missing. apt has no network timeout of its own: a stalled mirror
        # used to hang this step until the job timed out. See ZeroAlloc-Net/.github#47.
        timeout-minutes: 5
        run: |
          missing=""
          command -v clang >/dev/null || missing="$missing clang"
          dpkg -s zlib1g-dev >/dev/null 2>&1 || missing="$missing zlib1g-dev"
          if [ -z "$missing" ]; then
            echo "clang and zlib1g-dev are already installed"
            exit 0
          fi
          echo "Installing:$missing"
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y $missing

      - name: Restore
        run: dotnet restore samples/ZeroAlloc.Authorization.AotSmoke/ZeroAlloc.Authorization.AotSmoke.csproj

      - name: Publish AOT
        run: dotnet publish samples/ZeroAlloc.Authorization.AotSmoke/ZeroAlloc.Authorization.AotSmoke.csproj -r linux-x64 -c Release -o ./aot-out

      - name: Run AOT binary
        run: ./aot-out/ZeroAlloc.Authorization.AotSmoke

  api-compat:
    uses: ZeroAlloc-Net/.github/.github/workflows/api-compat.yml@main

  # A release PR must mark everything it releases as shipped: the analyzer rules in
  # AnalyzerReleases.Unshipped.md and the API in every PublicAPI.Unshipped.txt. The
  # ship-release-tracking job in release-please.yml commits that move onto the branch;
  # this fails the PR if the move is missing, or if a later commit on the branch adds
  # entries after it. Shared from ZeroAlloc-Net/.github; see ZeroAlloc-Net/.github#38.
  release-tracking:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    uses: ZeroAlloc-Net/.github/.github/workflows/release-tracking.yml@main
